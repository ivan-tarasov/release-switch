# shellcheck shell=bash
# A tiny project for tests/run.sh. The FIXTURE_* env vars make steps fail on purpose.

# shellcheck disable=SC2034 # Read by the engine.
SHARED=(.env data)
# shellcheck disable=SC2034 # Read by the engine.
COPY_FROM_LIVE=(cache)

preflight() {
    grep -q '^APP_ENV=production$' .env
}

build() {
    # Not the last command, so a failure here proves a step stops at its first error.
    [ -z "${FIXTURE_FAIL_BUILD:-}" ]
    "$PHP_BIN" -r 'file_put_contents("built", getenv("RELEASE_NAME"));'
    # Like vendor/: kept when copied from the live release, made fresh otherwise.
    mkdir -p cache
    [ -f cache/origin ] || printf '%s\n' "$RELEASE_NAME" > cache/origin
}

verify() {
    [ "$(cat built)" = "$RELEASE_NAME" ]
}

after_switch() {
    [ -z "${FIXTURE_FAIL_AFTER:-}" ]
    printf '%s\n' "$RELEASE_NAME" > "$DEPLOY_BASE/shared/data/switched"
}

health() {
    if [ -n "${FIXTURE_UNHEALTHY:-}" ]; then
        printf 'checking the queue\n'
        printf 'queue is stuck\n'

        return 1
    fi

    printf 'queue is empty\n'
}

# Like `artisan down`: the flag lives in shared data/, so every release serves the page.
down() {
    printf '%s\n' "${DOWN_REASON:-}" > data/down
}

up() {
    rm -f data/down
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Shellcheck
        run: shellcheck deploy tests/run.sh tests/fixture/deploy.conf

      - name: Deploy tests
        run: tests/run.sh

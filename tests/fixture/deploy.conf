# shellcheck shell=bash
# A tiny project for tests/run.sh. The FIXTURE_* env vars make steps fail on purpose.

# shellcheck disable=SC2034 # Read by the engine.
SHARED=(.env data)
# shellcheck disable=SC2034 # Read by the engine.
COPY_FROM_LIVE=(cache)
# shellcheck disable=SC2034 # Read by the engine. .github is missing on purpose.
CLEAR_PATHS=(tests .github "dev notes")

preflight() {
    grep -q '^APP_ENV=production$' .env
}

# Like a database dump before migrations. Logs each run, and marks the release for build.
backup() {
    printf '%s\n' "$RELEASE_NAME" >> "$DEPLOY_BASE/shared/data/backups"
    [ -z "${FIXTURE_FAIL_BACKUP:-}" ]
    touch backed_up
}

build() {
    # build runs after backup.
    [ -f backed_up ]
    # Not the last command, so a failure here proves a step stops at its first error.
    [ -z "${FIXTURE_FAIL_BUILD:-}" ]
    "$PHP_BIN" -r 'file_put_contents("built", getenv("RELEASE_NAME"));'
    # Like Laravel's config:cache: an absolute path baked into the build.
    pwd -P > built_path
    if [ -n "${FIXTURE_SLOW_BUILD:-}" ]; then
        # The PID of this step's subshell, so the test can kill it with the deploy.
        sh -c 'echo $PPID' > "$FIXTURE_SLOW_BUILD"
        # And of the sleep, so the test can see a timeout stopped it.
        sleep 30 &
        echo "$!" > "$FIXTURE_SLOW_BUILD.sleep"
        wait "$!"
    fi
    [ -z "${FIXTURE_BUILD_SLEEP:-}" ] || sleep "$FIXTURE_BUILD_SLEEP"
    printf '%s %s\n' "$DEPLOY_SLOT" "$DEPLOY_HOST" > slot
    # Like vendor/: kept when copied from the live release, made fresh otherwise.
    mkdir -p cache
    [ -f cache/origin ] || printf '%s\n' "$RELEASE_NAME" > cache/origin
}

verify() {
    [ "$(cat built)" = "$RELEASE_NAME" ]
}

after_switch() {
    [ -z "${FIXTURE_FAIL_AFTER:-}" ]
    printf '%s\n' "$RELEASE_NAME" > "$DEPLOY_BASE/shared/data/switched"
    if [ -n "${FIXTURE_DETAILS:-}" ]; then
        printf '%s=%s\n' SHA "$DEPLOY_SHA" REF "$DEPLOY_REF" PREVIOUS "$DEPLOY_PREVIOUS_RELEASE" \
            AUTHOR "$DEPLOY_AUTHOR" MESSAGE "$DEPLOY_MESSAGE" PERFORMER "$DEPLOY_PERFORMER" \
            FORCED "$DEPLOY_FORCED" > "$FIXTURE_DETAILS"
    fi
}

# Like `artisan up` after a build that took the site down.
failed() {
    printf '%s\n' "$RELEASE_NAME" > "$DEPLOY_BASE/shared/data/failed"
    [ -z "${FIXTURE_FAIL_FAILED:-}" ]
}

after_rollback() {
    printf '%s\n' "$RELEASE_NAME" > "$DEPLOY_BASE/shared/data/rolled_back"
    [ -z "${FIXTURE_FAIL_ROLLBACK:-}" ]
}

health() {
    [ -z "${FIXTURE_HEALTH_SLEEP:-}" ] || sleep "$FIXTURE_HEALTH_SLEEP"

    if [ -n "${FIXTURE_UNHEALTHY:-}" ]; then
        printf 'checking the queue\n'
        printf 'queue is stuck\n'

        return 1
    fi

    printf 'queue is empty\n'
}

# Like `artisan down`: the flag lives in shared data/, so every release serves the page.
down() {
    printf '%s\n' "${DOWN_REASON:-}" > data/down
}

up() {
    rm -f data/down
}
